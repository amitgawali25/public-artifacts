<script>
(async function(){
  const lock=()=>{document.getElementById('lock').hidden=false;};
  try{
    const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
    if(!m||!window.crypto||!crypto.subtle) return lock();
    const b64u=m[1].replace(/-/g,'+').replace(/_/g,'/');
    const raw=Uint8Array.from(atob(b64u+'==='.slice((b64u.length+3)%4)),c=>c.charCodeAt(0));
    const data=Uint8Array.from(atob(document.getElementById('payload').textContent.trim()),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
    const html=new TextDecoder().decode(plain);
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title||document.title;
    doc.head.querySelectorAll('style,link[rel=stylesheet],link[rel=preconnect],meta[name=viewport]').forEach(n=>document.head.appendChild(document.importNode(n,true)));
    const scripts=[...doc.body.querySelectorAll('script')];
    scripts.forEach(s=>s.remove());
    document.body.innerHTML=doc.body.innerHTML;
    for(const s of scripts){
      const n=document.createElement('script');
      for(const a of s.attributes) n.setAttribute(a.name,a.value);
      if(s.src){ await new Promise(r=>{n.onload=n.onerror=r; document.body.appendChild(n);}); }
      else { n.textContent=s.textContent; document.body.appendChild(n); }
    }
  }catch(e){ lock(); }
})();
</script>
