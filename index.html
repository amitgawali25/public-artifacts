<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Invitation</title>
<meta property="og:title" content="You're invited: Diwali at the Gawalis">
<meta property="og:description" content="Saturday 7 November, 6 pm onwards">
<meta property="og:image" content="https://amitgawali25.github.io/public-artifacts/preview.jpg">
<meta property="og:image:width" content="760">
<meta property="og:image:height" content="398">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Diwali Invitation">
<meta property="og:url" content="https://amitgawali25.github.io/public-artifacts/">
<meta property="og:image:secure_url" content="https://amitgawali25.github.io/public-artifacts/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Diwali invitation card">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#0a0b4d;color:#fdd46b;font-family:"Cormorant Garamond",Georgia,serif}
.lock{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.lock div{max-width:30ch;display:grid;gap:10px}
.lock h1{margin:0;font-size:28px;font-weight:700}
.lock p{margin:0;font-size:17px;line-height:1.4;color:#fff4dc}
.diya{font-size:40px;line-height:1}
.lock[hidden],.loading[hidden]{display:none}
.loading{min-height:100vh;min-height:100svh;display:grid;place-items:center}
.loading span{font-size:44px;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.loading span{animation:none}}
</style>
</head>
<body>
<div class="loading" id="loading" aria-label="Opening your invitation"><span aria-hidden="true">🪔</span></div>
<div class="lock" id="lock" hidden>
  <div>
    <div class="diya" aria-hidden="true">🪔</div>
    <h1>This invitation is private</h1>
    <p>Please open it using the full link you were sent on WhatsApp or iMessage.</p>
  </div>
</div>
<script>
(async function(){
  const lock=()=>{document.getElementById('loading').hidden=true;document.getElementById('lock').hidden=false;};
  try{
    const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
    if(!m||!window.crypto||!crypto.subtle) return lock();
    const b64u=m[1].replace(/-/g,'+').replace(/_/g,'/');
    const raw=Uint8Array.from(atob(b64u+'==='.slice((b64u.length+3)%4)),c=>c.charCodeAt(0));
    const res=await fetch('invite.dat',{cache:'no-cache'}); if(!res.ok) throw 0;
    const data=Uint8Array.from(atob((await res.text()).trim()),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
    const html=new TextDecoder().decode(plain);
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title||document.title;
    doc.head.querySelectorAll('style,link[rel=stylesheet],link[rel=preconnect],meta[name=viewport]').forEach(n=>document.head.appendChild(document.importNode(n,true)));
    const scripts=[...doc.body.querySelectorAll('script')];
    scripts.forEach(s=>s.remove());
    document.body.innerHTML=doc.body.innerHTML;
    for(const s of scripts){
      const n=document.createElement('script');
      for(const a of s.attributes) n.setAttribute(a.name,a.value);
      if(s.src){ await new Promise(r=>{n.onload=n.onerror=r; document.body.appendChild(n);}); }
      else { n.textContent=s.textContent; document.body.appendChild(n); }
    }
  }catch(e){ lock(); }
})();
</script>
</body>
</html>
